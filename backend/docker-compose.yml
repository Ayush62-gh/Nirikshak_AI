version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nirikshak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nirikshak_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nirikshak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirikshak_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Nirikshak AI - Legal Metrology Compliance Engine"
      APP_ENV: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nirikshak_db
      SYNC_DATABASE_URL: postgresql://postgres:postgres@db:5432/nirikshak_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyfornirikshaklegalmetrologycompliancesystem2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: uploads
      REPORT_DIR: reports
      MAX_UPLOAD_SIZE_MB: 25
      OCR_PROVIDER: tesseract
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports

volumes:
  postgres_data:
