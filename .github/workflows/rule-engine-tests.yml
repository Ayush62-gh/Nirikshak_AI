name: Rule Engine CI Tests

on:
  push:
    paths:
      - 'rule_engine/**'
  pull_request:
    paths:
      - 'rule_engine/**'

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rule_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: rule_engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest -q
